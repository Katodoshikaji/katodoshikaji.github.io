<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photography Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .intro {
      background: #fff;
      max-width: 900px;
      margin: 40px auto;
      padding: 40px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    @media (min-width: 1200px) {
      .gallery {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* POPUP */
    .popup {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      text-align: center;
    }

    .popup img {
      max-width: 90%;
      max-height: 80%;
      margin-top: 60px;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
    }

    .arrow {
      position: absolute;
      top: 50%;
      font-size: 50px;
      color: white;
      cursor: pointer;
      user-select: none;
      transform: translateY(-50%);
    }

    .left {
      left: 20px;
    }

    .right {
      right: 20px;
    }

    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

<header>
  <h1>My Photography Portfolio</h1>
  <p>Capturing moments through my lens</p>
</header>

<section class="intro">
  <h2>Welcome</h2>
  <p>Hi, I'm <strong>Anurag</strong> — capturing moments and stories through photography.</p>
</section>

<section class="gallery">
  <img src="your-photo1.jpg">
  <img src="your-photo2.jpg">
  <img src="your-photo3.jpg">
  <img src="your-photo4.jpg">
  <img src="your-photo5.jpg">
  <img src="your-photo6.jpg">
  <img src="your-photo7.jpg">
  <img src="your-photo8.jpg">
  <img src="your-photo9.jpg">
  <img src="your-photo10.jpg">
  <img src="your-photo11.jpg">
  <img src="your-photo12.jpg">
</section>

<!-- POPUP -->
<div id="popup" class="popup">
  <span class="close">&times;</span>
  <span class="arrow left">&#10094;</span>
  <img id="popup-img">
  <span class="arrow right">&#10095;</span>
</div>

<footer>
  <p>© 2025 Anurag</p>
</footer>

<script>
  const images = document.querySelectorAll(".gallery img");
  const popup = document.getElementById("popup");
  const popupImg = document.getElementById("popup-img");
  const closeBtn = document.querySelector(".close");
  const leftArrow = document.querySelector(".left");
  const rightArrow = document.querySelector(".right");

  let currentIndex = 0;

  function showImage(index) {
    if (index < 0) index = images.length - 1;
    if (index >= images.length) index = 0;
    currentIndex = index;
    popupImg.src = images[currentIndex].src;
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => {
      popup.style.display = "block";
      showImage(index);
    });
  });

  rightArrow.onclick = () => showImage(currentIndex + 1);
  leftArrow.onclick = () => showImage(currentIndex - 1);

  closeBtn.onclick = () => popup.style.display = "none";

  popup.onclick = (e) => {
    if (e.target === popup) popup.style.display = "none";
  };

  document.addEventListener("keydown", (e) => {
    if (popup.style.display === "block") {
      if (e.key === "ArrowRight") showImage(currentIndex + 1);
      if (e.key === "ArrowLeft") showImage(currentIndex - 1);
      if (e.key === "Escape") popup.style.display = "none";
    }
  });
</script>

</body>
</html>
