<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anurag — Photography</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@100;200;300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.18);
      --white: #f0ece4;
      --dim: rgba(240, 236, 228, 0.55);
      --dark: #0a0908;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      cursor: crosshair;
    }

    /* ── FILM GRAIN OVERLAY ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* ── LANDING ── */
    .landing {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-photo {
      position: absolute;
      inset: 0;
      background: url('your-photo37.jpg') center center / cover no-repeat;
      transform: scale(1.06);
      animation: slowZoom 18s ease-out forwards;
      z-index: 0;
    }

    @keyframes slowZoom {
      from {
        transform: scale(1.06);
      }

      to {
        transform: scale(1.0);
      }
    }

    /* multi-layer vignette */
    .bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.1) 40%, rgba(0, 0, 0, 0.1) 60%, rgba(0, 0, 0, 0.7) 100%);
    }

    /* thin horizontal rule accents */
    .rule {
      position: relative;
      z-index: 1;
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin-bottom: 28px;
      animation: fadeUp 1.4s ease forwards;
      opacity: 0;
    }

    .rule-bottom {
      height: 40px;
      margin-top: 28px;
      margin-bottom: 0;
      animation-delay: 0.8s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .landing-text {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 1.2s ease 0.2s forwards;
      opacity: 0;
    }

    .eyebrow {
      font-family: 'Raleway', sans-serif;
      font-weight: 100;
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .landing-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3.2rem, 8vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--white);
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
    }

    .landing-text h1 span {
      font-style: normal;
      font-weight: 300;
      font-size: 0.45em;
      display: block;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 10px;
    }

    .tagline {
      font-family: 'Raleway', sans-serif;
      font-weight: 100;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 18px;
    }

    /* ── FOLDER ── */
    .folder-area {
      position: relative;
      z-index: 1;
      margin-top: 44px;
      animation: fadeUp 1.2s ease 0.5s forwards;
      opacity: 0;
    }

    .folder-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: crosshair;
      background: none;
      border: none;
      padding: 0;
    }

    .folder-outer {
      position: relative;
      width: 72px;
      height: 58px;
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      filter: drop-shadow(0 0 18px rgba(201, 168, 76, 0.25));
    }

    .folder-btn:hover .folder-outer {
      transform: translateY(-5px);
      filter: drop-shadow(0 6px 28px rgba(201, 168, 76, 0.5));
    }

    .folder-outer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 13px;
      background: var(--gold);
      border-radius: 4px 4px 0 0;
      opacity: 0.85;
    }

    .folder-outer::after {
      content: '';
      position: absolute;
      top: 9px;
      left: 0;
      width: 72px;
      height: 49px;
      background: linear-gradient(135deg, #d4a843, #a07830);
      border-radius: 0 5px 5px 5px;
    }

    .folder-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── CORNER MARKS ── */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      z-index: 1;
      opacity: 0.4;
    }

    .corner-tl {
      top: 28px;
      left: 36px;
      border-top: 1px solid var(--gold);
      border-left: 1px solid var(--gold);
    }

    .corner-tr {
      top: 28px;
      right: 36px;
      border-top: 1px solid var(--gold);
      border-right: 1px solid var(--gold);
    }

    .corner-bl {
      bottom: 28px;
      left: 36px;
      border-bottom: 1px solid var(--gold);
      border-left: 1px solid var(--gold);
    }

    .corner-br {
      bottom: 28px;
      right: 36px;
      border-bottom: 1px solid var(--gold);
      border-right: 1px solid var(--gold);
    }

    /* scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
    }

    .scroll-hint span {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .scroll-line {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: pulse 2s ease-in-out 1.6s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* ── FULL SCREEN GALLERY ── */
    .gallery-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #070605;
      z-index: 500;
      flex-direction: column;
    }

    .gallery-screen.active {
      display: flex;
    }

    .gallery-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 30px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
      background: rgba(7, 6, 5, 0.95);
      backdrop-filter: blur(10px);
    }

    .gallery-bar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gallery-bar-left .mini-folder {
      width: 18px;
      height: 14px;
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }

    .mini-folder::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 7px;
      height: 4px;
      background: #c9a84c;
      border-radius: 2px 2px 0 0;
    }

    .mini-folder::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 0;
      width: 18px;
      height: 11px;
      background: linear-gradient(135deg, #d4a843, #a07830);
      border-radius: 0 2px 2px 2px;
    }

    .gallery-title {
      font-family: 'Raleway', sans-serif;
      font-weight: 100;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .gallery-count {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(201, 168, 76, 0.4);
    }

    .gallery-close {
      background: none;
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: var(--gold);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      line-height: 1;
    }

    .gallery-close:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .gallery-grid {
      overflow-y: auto;
      padding: 24px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      flex: 1;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      cursor: crosshair;
      aspect-ratio: 1 / 1;
    }

    .gallery-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      transition: background 0.3s;
    }

    .gallery-item:hover::after {
      background: rgba(201, 168, 76, 0.08);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* item number badge */
    .gallery-item .num {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: rgba(240, 236, 228, 0.35);
      z-index: 1;
      pointer-events: none;
      transition: color 0.3s;
    }

    .gallery-item:hover .num {
      color: var(--gold);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 3, 2, 0.97);
      z-index: 600;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 88vw;
      max-height: 86vh;
      border-radius: 2px;
      object-fit: contain;
      transition: opacity 0.2s ease;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
    }

    .lb-close {
      position: fixed;
      top: 18px;
      right: 26px;
      background: none;
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: var(--gold);
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: crosshair;
      z-index: 610;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      line-height: 1;
    }

    .lb-close:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(201, 168, 76, 0.25);
      color: var(--gold);
      font-size: 26px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      z-index: 610;
      transition: all 0.3s;
    }

    .lb-arrow:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .lb-prev {
      left: 18px;
    }

    .lb-next {
      right: 18px;
    }

    .lb-counter {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: rgba(201, 168, 76, 0.5);
      z-index: 610;
      pointer-events: none;
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer p {
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(240, 236, 228, 0.25);
    }

    footer .year {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.75rem;
      color: rgba(201, 168, 76, 0.3);
    }

    @media (max-width: 600px) {

      .corner-tl,
      .corner-tr,
      .corner-bl,
      .corner-br {
        display: none;
      }

      .landing-text h1 {
        font-size: 3rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 6px;
        padding: 14px;
      }

      .lb-arrow {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }

      .lb-prev {
        left: 8px;
      }

      .lb-next {
        right: 8px;
      }

      footer {
        padding: 12px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- LANDING -->
  <section class="landing">
    <div class="bg-photo"></div>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="rule"></div>

    <div class="landing-text">
      <p class="eyebrow">Visual Stories by</p>
      <h1>Anurag<span>Photography</span></h1>
      <p class="tagline">Light &nbsp;·&nbsp; Moment &nbsp;·&nbsp; Emotion</p>
    </div>

    <div class="rule rule-bottom"></div>

    <div class="folder-area">
      <button class="folder-btn" id="folderBtn">
        <div class="folder-outer"></div>
        <span class="folder-label">My Work</span>
      </button>
    </div>

    <div class="scroll-hint">
      <span>Open</span>
      <div class="scroll-line"></div>
    </div>

    <footer>
      <p>Anurag Singh &nbsp;·&nbsp; anuragsinghofficial25@gmail.com</p>
      <span class="year">2025</span>
    </footer>
  </section>

  <!-- FULL SCREEN GALLERY -->
  <div class="gallery-screen" id="galleryScreen">
    <div class="gallery-bar">
      <div class="gallery-bar-left">
        <span class="mini-folder"></span>
        <span class="gallery-title">My Work</span>
        <span class="gallery-count">36 photographs</span>
      </div>
      <button class="gallery-close" id="galleryClose">&times;</button>
    </div>
    <div class="gallery-grid" id="galleryGrid">
      <div class="gallery-item"><img src="your-photo1.jpg"><span class="num">01</span></div>
      <div class="gallery-item"><img src="your-photo2.jpg"><span class="num">02</span></div>
      <div class="gallery-item"><img src="your-photo3.jpg"><span class="num">03</span></div>
      <div class="gallery-item"><img src="your-photo4.jpg"><span class="num">04</span></div>
      <div class="gallery-item"><img src="your-photo5.jpg"><span class="num">05</span></div>
      <div class="gallery-item"><img src="your-photo6.jpg"><span class="num">06</span></div>
      <div class="gallery-item"><img src="your-photo7.jpg"><span class="num">07</span></div>
      <div class="gallery-item"><img src="your-photo8.jpg"><span class="num">08</span></div>
      <div class="gallery-item"><img src="your-photo9.jpg"><span class="num">09</span></div>
      <div class="gallery-item"><img src="your-photo10.jpg"><span class="num">10</span></div>
      <div class="gallery-item"><img src="your-photo11.jpg"><span class="num">11</span></div>
      <div class="gallery-item"><img src="your-photo12.jpg"><span class="num">12</span></div>
      <div class="gallery-item"><img src="your-photo13.jpg"><span class="num">13</span></div>
      <div class="gallery-item"><img src="your-photo14.jpg"><span class="num">14</span></div>
      <div class="gallery-item"><img src="your-photo15.jpg"><span class="num">15</span></div>
      <div class="gallery-item"><img src="your-photo16.jpg"><span class="num">16</span></div>
      <div class="gallery-item"><img src="your-photo17.jpg"><span class="num">17</span></div>
      <div class="gallery-item"><img src="your-photo18.jpg"><span class="num">18</span></div>
      <div class="gallery-item"><img src="your-photo19.jpg"><span class="num">19</span></div>
      <div class="gallery-item"><img src="your-photo20.jpg"><span class="num">20</span></div>
      <div class="gallery-item"><img src="your-photo21.jpg"><span class="num">21</span></div>
      <div class="gallery-item"><img src="your-photo22.jpg"><span class="num">22</span></div>
      <div class="gallery-item"><img src="your-photo23.jpg"><span class="num">23</span></div>
      <div class="gallery-item"><img src="your-photo24.jpg"><span class="num">24</span></div>
      <div class="gallery-item"><img src="your-photo25.jpg"><span class="num">25</span></div>
      <div class="gallery-item"><img src="your-photo26.jpg"><span class="num">26</span></div>
      <div class="gallery-item"><img src="your-photo27.jpg"><span class="num">27</span></div>
      <div class="gallery-item"><img src="your-photo28.jpg"><span class="num">28</span></div>
      <div class="gallery-item"><img src="your-photo29.jpg"><span class="num">29</span></div>
      <div class="gallery-item"><img src="your-photo30.jpg"><span class="num">30</span></div>
      <div class="gallery-item"><img src="your-photo31.jpg"><span class="num">31</span></div>
      <div class="gallery-item"><img src="your-photo32.jpg"><span class="num">32</span></div>
      <div class="gallery-item"><img src="your-photo33.jpg"><span class="num">33</span></div>
      <div class="gallery-item"><img src="your-photo34.jpg"><span class="num">34</span></div>
      <div class="gallery-item"><img src="your-photo35.jpg"><span class="num">35</span></div>
      <div class="gallery-item"><img src="your-photo36.jpg"><span class="num">36</span></div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">&times;</button>
    <button class="lb-arrow lb-prev" id="lbPrev">&#8249;</button>
    <img id="lbImg" alt="Enlarged photo">
    <button class="lb-arrow lb-next" id="lbNext">&#8250;</button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script>
    const folderBtn = document.getElementById("folderBtn");
    const galleryScreen = document.getElementById("galleryScreen");
    const galleryClose = document.getElementById("galleryClose");
    const galleryGrid = document.getElementById("galleryGrid");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbClose = document.getElementById("lbClose");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");
    const lbCounter = document.getElementById("lbCounter");

    const items = Array.from(galleryGrid.querySelectorAll(".gallery-item img"));
    let current = 0;

    folderBtn.addEventListener("click", () => {
      galleryScreen.classList.add("active");
      document.body.style.overflow = "hidden";
    });

    function closeGallery() {
      galleryScreen.classList.remove("active");
      if (!lightbox.classList.contains("active")) document.body.style.overflow = "";
    }
    galleryClose.addEventListener("click", closeGallery);

    items.forEach((img, i) => {
      img.parentElement.addEventListener("click", () => openLightbox(i));
    });

    function openLightbox(i) {
      current = i;
      showLb();
      lightbox.classList.add("active");
    }
    function closeLightbox() {
      lightbox.classList.remove("active");
    }
    function showLb() {
      lbImg.style.opacity = "0";
      lbImg.src = items[current].src;
      lbImg.onload = () => lbImg.style.opacity = "1";
      if (lbImg.complete) lbImg.style.opacity = "1";
      lbCounter.textContent = String(current + 1).padStart(2, '0') + "  ·  " + String(items.length).padStart(2, '0');
    }
    function prev() { current = (current - 1 + items.length) % items.length; showLb(); }
    function next() { current = (current + 1) % items.length; showLb(); }

    lbClose.addEventListener("click", e => { e.stopPropagation(); closeLightbox(); });
    lbPrev.addEventListener("click", e => { e.stopPropagation(); prev(); });
    lbNext.addEventListener("click", e => { e.stopPropagation(); next(); });
    lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener("keydown", e => {
      if (lightbox.classList.contains("active")) {
        if (e.key === "ArrowLeft") prev();
        if (e.key === "ArrowRight") next();
        if (e.key === "Escape") closeLightbox();
      } else if (galleryScreen.classList.contains("active")) {
        if (e.key === "Escape") closeGallery();
      }
    });

    let tx = 0;
    lightbox.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    }, { passive: true });
  </script>

</body>

</html>
